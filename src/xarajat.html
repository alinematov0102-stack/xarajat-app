<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-slate-200">
    <div class="bg-amber-50 w-[400px] mx-auto mt-20 p-6 rounded-xl shadow">
      <div class="flex justify-center items-center flex-col">
        <p class="text-3xl mb-4 font-semibold">Xarajatlar Nazorati</p>
        <input
          id="nameInput"
          class="border border-slate-200 rounded-xl mb-4 w-[350px] py-2.5 mt-2.5 pl-1.5"
          type="text"
          placeholder="Mahsulot nomi"
        />
        <input
          id="priceInput"
          class="border border-slate-200 rounded-xl mb-4 w-[350px] py-2.5 mt-2.5 pl-1.5"
          type="text"
          placeholder="Narx (so'm)"
        />
        <button
          id="add"
          class="w-full bg-blue-600 text-white p-3 rounded-xl cursor-pointer"
        >
          Qo'shish
        </button>
      </div>

      <ul id="expenseList" class="space-y-3 mb-6"></ul>

      <div class="flex justify-between mt-6 text-lg font-semibold">
        <p class="text-2xl">Umumiy:</p>
        <p id="total" class="text-blue-600">0 so'm</p>
      </div>

      <div>
        <p
          id="clear"
          class="text-center text-red-600 underline mt-4 cursor-pointer"
        >
          Barchasini tozalash
        </p>
      </div>
    </div>
    <script src="xarajat.js"></script>
  </body>
</html>
